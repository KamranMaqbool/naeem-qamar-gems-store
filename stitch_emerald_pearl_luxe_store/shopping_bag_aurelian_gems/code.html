<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aurelian Gems - Cart Drawer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                      "background": "#faf9f6",
                      "tertiary-container": "#313131",
                      "outline": "#717973",
                      "on-error-container": "#93000a",

                      "secondary-container": "#fed65b",
                      "on-surface-variant": "#414944",
                      "on-tertiary": "#ffffff",

<style>
        .drawer-slide-in {
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .backdrop-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen relative overflow-hidden">
<!-- Mock Background Content to show overlay effect -->
<div class="h-screen w-full bg-surface-container-low flex items-center justify-center">
<p class="font-headline-lg text-headline-lg text-primary/30">Background Canvas</p>
</div>
<!-- Cart Drawer Overlay Container -->
<div aria-modal="true" class="fixed inset-0 z-50 flex justify-end" role="dialog">
<!-- Backdrop -->
<div aria-hidden="true" class="absolute inset-0 bg-primary/20 backdrop-blur-sm backdrop-fade-in"></div>
<!-- Drawer Panel -->
<div class="relative w-full max-w-md h-full bg-surface-container-lowest shadow-2xl flex flex-col drawer-slide-in">
<!-- Header -->
<div class="px-8 py-6 border-b border-outline-variant/30 flex items-center justify-between">
<h2 class="font-headline-md text-headline-md text-primary">Your Treasure Bag</h2>
<button class="text-on-surface-variant hover:text-primary transition-colors p-2 -mr-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Cart Items -->
<div class="flex-1 overflow-y-auto px-8 py-6 space-y-8">
<!-- Item 1 -->
<div class="flex gap-6 group">
<div class="w-24 h-24 flex-shrink-0 bg-surface-container-low overflow-hidden">
<img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" data-alt="A macro photograph of a brilliant 2-carat Ceylon sapphire ring resting on dark grey silk. The lighting is dramatic and precise, highlighting the deep cornflower blue of the gemstone. The setting is a minimalist platinum band, embodying a high-end, luxury aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDKewHUQbwVF5HHTQJWvEuL8tvqJdcN1u41bOIfuWSLUMJ_fw3dfvNrIFEw9r89BzxF9JZJTfCkHKnDW_QNSyRVMrZ-X029zJTp53mrZ_13QdirabQgK4QfAmayrWK_UZ6hBbtv2VTHWwk84Y0OO_M3aWaqgVgj80qwAlOCgr19x92MpI3_uzqaWZU8TzSNApiMy8SBgZvmEMeavUIj0j0P6B4kP8l4gGpE2QAyJDk6c6whIhxztGzJ"/>
</div>
<div class="flex flex-col justify-between flex-1 py-1">
<div>
<h3 class="font-body-lg text-body-lg text-primary font-medium">2-Carat Ceylon Sapphire</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Loose Gemstone</p>
</div>
<div class="flex items-center justify-between mt-4">
<span class="font-body-lg text-body-lg text-primary">$4,500</span>
<button class="font-label-caps text-label-caps text-on-surface-variant hover:text-error transition-colors underline decoration-1 underline-offset-4">Remove</button>
</div>
</div>
</div>
<!-- Divider -->
<hr class="border-outline-variant/30"/>
<!-- Item 2 -->
<div class="flex gap-6 group">
<div class="w-24 h-24 flex-shrink-0 bg-surface-container-low overflow-hidden">
<img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" data-alt="A close-up studio shot of a 1.5-carat Pigeon Blood ruby ring against a black velvet background. The gemstone glows with an intense, fiery red under spotlighting. The classic setting features small diamond accents, showcasing a premium, exclusive jewelry design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAxKAmBIR0MAftZpjKdpmfC4XBHPlVgpZwtEH16Au4_n_ymh8wuT1ASNlF9C9q-sy3gjbzyTmhuXtlm-H7Fd8wUz8xiylzy1FVRN3E8RO5yibaG_Cu4Z6GaO73C0QTc7E6rZM0yoZVwxkMcfR26sIyVcyfl0LVZTpwpLoyPvYhZCGXcEt0Y0_n3hyRG-fnFZd7T3TVQWexn8pf_QgWsSg1uX6YLed46cXqaW304i2NhfrYwu6WaBvgO"/>
</div>
<div class="flex flex-col justify-between flex-1 py-1">
<div>
<h3 class="font-body-lg text-body-lg text-primary font-medium">1.5-Carat Pigeon Blood Ruby</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Loose Gemstone</p>
</div>
<div class="flex items-center justify-between mt-4">
<span class="font-body-lg text-body-lg text-primary">$6,200</span>
<button class="font-label-caps text-label-caps text-on-surface-variant hover:text-error transition-colors underline decoration-1 underline-offset-4">Remove</button>
</div>
</div>
</div>
</div>
<!-- Footer / Checkout Action -->
<div class="px-8 py-8 bg-surface border-t border-outline-variant/30">
<div class="flex justify-between items-end mb-6">
<span class="font-body-md text-body-md text-on-surface-variant uppercase tracking-widest">Subtotal</span>
<span class="font-headline-md text-headline-md text-primary tracking-tight">$10,700</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-6 text-sm text-center">Shipping and taxes calculated at checkout.</p>
<button class="w-full py-4 px-8 bg-primary-container text-on-primary font-button text-button uppercase tracking-widest rounded hover:bg-primary transition-colors duration-300 flex items-center justify-center gap-2 group">
                    Proceed to Secure Checkout
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
